<!-- Q18. Combine a semantic layout, a table and a validated form in one page. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <title>ABC College Admission 2026</title>
</head>
<body>
    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>
        <section>
            <h2>Courses and Fees</h2>
            <table border="1">
                <caption>Available Courses</caption>
                <thead>
                    <tr>
                        <th>Course</th>
                        <th>Seats</th>
                        <th>Fees</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>B.Tech CSE</td>
                        <td>120</td>
                        <td>₹90,000</td>
                    </tr>
                    <tr>
                        <td>BCA</td>
                        <td>60</td>
                        <td>₹45,000</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <br>

        <section>
            <form action="submit.php" method="post">
                <fieldset>
                    <legend>Application Form</legend>

                    <label for="name">Name:</label>
                    <br>
                    <input type="text" id="name" name="name" required>
                    <br><br>

                    <label for="email">Email:</label>
                    <br>
                    <input type="email" id="email" name="email" required>
                    <br><br>

                    <label for="course">Course:</label>
                    <br>
                    <select id="course" name="course">
                        <option value="B.Tech CSE">B.Tech CSE</option>
                        <option value="BCA">BCA</option>
                    </select>
                    <br><br>

                    <label for="statement">Statement:</label>
                    <br>
                    <textarea id="statement" name="statement" rows="5"
                              cols="30" required></textarea>
                    <br><br>

                    <button type="submit">Apply</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ABC College</p>
    </footer>
</body>
</html>
