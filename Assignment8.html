<!-- Q8. Use internal, external, email and image links with attributes. -->
<!DOCTYPE html>
<html>
<head>
    <title>Links Demo</title>
</head>
<body>
    <h3 id="top">Links Demo</h3>

    <p><a href="https://www.google.com" target="_blank">External link</a></p>
    <p><a href="#bottom">Jump to bottom</a></p>
    <p><a href="mailto:admin@example.com">Email us</a></p>

    <p>Logo</p>
    <a href="https://www.google.com" target="_blank">
        <img src="logo.png.jpg" alt=" Logo" width="100" height="100">
    </a>

    <p id="bottom">Bottom. <a href="#top">Back to top</a></p>
</body>
</html>
