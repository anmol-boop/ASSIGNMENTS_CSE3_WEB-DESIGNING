<!-- Q7. Turn an unordered list into a horizontal navigation menu. -->

<!DOCTYPE html>
<html>
<head>
    <title>Navigation Menu</title>

    <style>
        li {
            display: inline;
            margin-right: 30px;
        }
    </style>

</head>
<body>

    <ul>
        <li>Home</li>
        <li>About</li>
        <li>Courses</li>
        <li>Contact</li>
    </ul>

</body>
</html>
